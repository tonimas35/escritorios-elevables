# Red de seguridad del catálogo (PLAN-CATALOGO.md, fase 3).
# Si algo de esto falla, no se publica: lint, validación de datos, tests y build.
name: CI

on:
  push:
  pull_request:

jobs:
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22.18 o superior: ejecuta TypeScript sin compilar (validador y tests).
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run validar
      - run: npm test
      - run: npx next build
